  _build_dataroom_page() in app/web.py uses a resource-load check rather than the
  Home's blunt "no http(s):// anywhere" assert (see the doc-comment at web.py:210-213).

  This is the TRUSTED HOST shell (not a sandboxed module), so host JS is allowed here.
-->
